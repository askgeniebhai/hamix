name: Feedback CI

on:
  pull_request:
    paths:
      - 'feedback/**'
      - '.github/workflows/feedback-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'feedback/**'
      - '.github/workflows/feedback-ci.yml'

permissions:
  contents: read

jobs:
  repo-guard-self-test:
    name: RepoGuard self-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: RepoGuard self-test (proves the guard genuinely fails on bad fixtures)
        run: node feedback/scripts/repo-guard.js --self-test

  tier1-static-quality:
    name: Tier 1 — Code / Static Quality
    needs: repo-guard-self-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: feedback/package-lock.json

      - name: RepoGuard (scope, conflict, secret, dangerous-file, hygiene, governance, boundary)
        run: node feedback/scripts/repo-guard.js --base origin/${{ github.event.repository.default_branch }}

      - name: JavaScript syntax check
        run: |
          find feedback -path 'feedback/node_modules' -prune -o -path 'feedback/.next' -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: JSON validation
        run: |
          find feedback -path 'feedback/node_modules' -prune -o -path 'feedback/.next' -prune -o -name '*.json' -print0 > /tmp/feedback-json-files
          xargs -0 -n1 -a /tmp/feedback-json-files node -e "const fs=require('fs'); JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));"

      - name: Install dependencies
        working-directory: feedback
        run: npm ci

      - name: Lint
        working-directory: feedback
        run: npm run lint

  tier2-build-integration:
    name: Tier 2 — Build / Integration
    needs: tier1-static-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (clean checkout reproduction)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: feedback/package-lock.json

      - name: RepoGuard executes
        run: node feedback/scripts/repo-guard.js --base origin/${{ github.event.repository.default_branch }}

      - name: RepoGuard self-test executes and fails on an intentional violation
        run: node feedback/scripts/repo-guard.js --self-test

      - name: Validate feedback-ci.yml is syntactically valid YAML
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/feedback-ci.yml')); print('feedback-ci.yml: valid YAML')"

      - name: Install dependencies (clean, from lockfile)
        working-directory: feedback
        run: npm ci

      - name: Production build
        working-directory: feedback
        run: npm run build

      - name: Type check
        working-directory: feedback
        run: npm run typecheck

      - name: Unit tests (Vitest)
        working-directory: feedback
        run: npm run test

      - name: Validate drizzle.config.ts loads (no schema/migrations yet)
        working-directory: feedback
        run: npx drizzle-kit check --config drizzle.config.ts
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_placeholder

  tier3-runtime-e2e:
    name: Tier 3 — Runtime / E2E
    needs: tier2-build-integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (clean checkout reproduction)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: feedback/package-lock.json

      - name: RepoGuard self-test + real run (full validation pipeline)
        run: |
          node feedback/scripts/repo-guard.js --self-test
          node feedback/scripts/repo-guard.js --base origin/${{ github.event.repository.default_branch }}

      - name: Explicit boundary verification (independent of RepoGuard's own logic)
        run: |
          BASE="origin/${{ github.event.repository.default_branch }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD || true)
          OUT_OF_SCOPE=$(echo "$CHANGED" | grep -vE '^feedback/|^\.github/workflows/feedback-[A-Za-z0-9_.-]+\.ya?ml$' || true)
          if [ -n "$OUT_OF_SCOPE" ]; then
            echo "Boundary violation — files changed outside feedback/**:"
            echo "$OUT_OF_SCOPE"
            exit 1
          fi
          echo "Boundary verified: all changed files are within feedback/** or feedback-*.yml workflows."

      - name: Install dependencies
        working-directory: feedback
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('feedback/package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: feedback
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (build, launch, and verify the real app shell)
        working-directory: feedback
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: feedback/playwright-report/
          retention-days: 7
